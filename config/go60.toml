-- -- KC_TRNS KC_TRNS KC_TRNS -- -- -- -- KC_VOLU KC_VOLD KC_RBRC -- --
"""

# Connection selector: the left thumb column is BLE slots 1-3 (USER(0)-USER(2)),
# and Esc — the key beside Magic, matching the Glove80's Esc thumb key — moves
# typing back to USB. Lighting controls are W/S brightness, A/D effect cycle,
# C palette, E PaletteFX, T lighting mode. The F1-F5 positions — the same
# keys whose LEDs indicate layers 1-5 — latch those layers on/off.
[[layer]]
id = "layer2"
name = "Magic"
keys = """

TG(1) TG(2) TG(3) TG(4) TG(5) USER(2) USER(0) -- -- -- -- -- -- --
-- -- BL_UP UG_TOGG MAINT_LOCK_TOG UG_OMODE USER(1) -- -- -- -- -- -- --
QK_BOOT UG_PREV BL_DOWN UG_NEXT -- -- USER(2) -- -- -- -- -- -- USER(12)
QK_RBT -- -- UG_HUEU -- USER(13) -- -- -- -- -- -- -- QK_RBT
-- -- -- -- QK_OUTPUT_USB -- -- -- -- -- -- -- -- --
"""

[[layer]]
id = "layer3"
name = "Games"
keys = """

KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_SPC KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS
KC_TRNS KC_TRNS KC_W KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS
KC_TRNS KC_A KC_S KC_D KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS
KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS -- -- KC_TRNS KC_TRNS KC_TRNS KC_TRNS KC_TRNS TG(3)
-- -- KC_TRNS KC_TRNS KC_TRNS -- -- -- -- KC_TRNS KC_TRNS KC_TRNS -- --
"""

