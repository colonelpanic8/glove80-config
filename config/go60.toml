[[morse]]
name = "morse 0"
tap = "KC_DEL"
hold = "MO(5)"
hold_timeout_ms = 180

[behavior]
combo_timeout_ms = 50
oneshot_timeout_ms = 1000
tap_interval_ms = 20
tap_capslock_interval_ms = 20
oneshot_activate_on_keypress = false
oneshot_quick_release = false

[behavior.morse]
enable_flow_tap = false
prior_idle_ms = 120

[behavior.morse.default_profile]
hold_timeout_ms = 250
gap_timeout_ms = 250

[pointing]

[[pointing.device]]
device_id = 0
mode = "scroll"

[[pointing.device]]
device_id = 1
mode = "cursor"

# Holding Magic on the left thumb turns both pads into pointing tools: the
# left one moves the cursor, and the right one drags — the mouse button is
# down for exactly as long as a finger is on the pad, no tap gestures
# involved, so touch grabs, the stroke moves what was grabbed, and lifting
# the finger (or releasing Magic) drops it.
[[pointing.override]]
layer = 2
device_id = 0
mode = "cursor"

[[pointing.override]]
layer = 2
device_id = 1
mode = "press"

[lighting]
brightness = 255
output_mode = "powered-only"
wake_layers = [2]
scene_policy = "active-stack"

