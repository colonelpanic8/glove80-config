# Magic's lighting controls and state indicators live beside their
# [[layer.bind]] entries in the layer section above: brightness controls are
# yellow, effect cycling is white, and palette cycling is magenta.

# Active-layer indicators: F1-F5 show layers 1-5 in blue while active.

[[lighting.scene]]
layer = 1
key = [0, 0]
color = "#0000ff"

[[lighting.scene]]
layer = 2
key = [0, 1]
color = "#0000ff"

