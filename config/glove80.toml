# Connection-slot indicator on the left thumb cluster while Magic is held.
# LEDs 0/1/3/4 sit under the four BLE slot keys (top to bottom), LED 5 under
# the USB key. Later rules win shared slots, so per-slot state stacks:
# dim = selected but idle, blinking = advertising, full colour = connected.
# The USB key glows green whenever USB is the transport actually carrying
# output. Slot hues: 0 blue, 1 teal, 2 violet, 3 amber.

[[lighting.conditional_scene]]
led = 0
color = "#020b18"
layer = { layer = 2, active = true }
connection = { profile = 0, ble_state = "inactive" }

[[lighting.conditional_scene]]
led = 0
color = "#0060ff"
effect = "blink"
period_ms = 800
phase_ms = 0
duty = 50
layer = { layer = 2, active = true }
connection = { profile = 0, ble_state = "advertising" }

[[lighting.conditional_scene]]
led = 0
color = "#0060ff"
layer = { layer = 2, active = true }
connection = { profile = 0, ble_state = "connected" }

