key = [0, 2]
color = "#0000ff"

[[lighting.scene]]
layer = 4
key = [0, 3]
color = "#0000ff"

[[lighting.scene]]
layer = 5
key = [0, 4]
color = "#0000ff"

# Games and Paseo key highlights live beside their [[layer.bind]] entries
# above; a scene on a layer only shows while that layer is active.

# Battery gauges on the Magic layer, five LEDs per half. Order matters:
# later rules win the LEDs they share, so the level bands come first, the
# low-battery overrides next, and charging last so it beats both.

