# PaletteFX on/off indicator on E. RGB_TOG works by
# zeroing the extension's brightness, and that is the state this reads: green
# while effects render, dim red while they are toggled off. The colors follow
# the output-mode rules above, where green is on and dark red is off.

[[lighting.conditional_scene]]
led = 18
color = "#008000"
layer = { layer = 2, active = true }
effects = { enabled = true }

[[lighting.conditional_scene]]
led = 18
color = "#800000"
layer = { layer = 2, active = true }
effects = { enabled = false }

# Connection indicator on the left thumb cluster while Magic is held.
# One color per state on every slot key (later rules win): white = empty,
# red = paired but idle, blue = selected or connected-but-idle (blinking =
# advertising), green = carrying typing. Green means "keystrokes go here"
# everywhere, so a connected slot only turns green once BLE is the active
# transport — otherwise it stays blue like a plugged-but-idle USB key. The USB key (LED 0, Esc position): red = unplugged, blue =
# plugged but typing elsewhere, green = carrying typing. Slot keys are the
# lower arc: LED 3 = slot 1, LED 4 = slot 2, LED 5 = slot 3.

[[lighting.conditional_scene]]
led = 3
color = "#2a2a2a"
layer = { layer = 2, active = true }
connection = { bonded = { slot = 0, bonded = false } }

