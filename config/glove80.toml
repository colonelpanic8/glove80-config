# Ivan's Glove80 runtime configuration for the current moergo-rmk firmware.
bluetooth_name = "WhiteG80 {slot}"
default_layer = 0
#
# This matches the compiled-in layers in
# dependencies/moergo-rmk/crates/glove80-rmk/keyboard.toml and is applied
# at runtime through RMK's native Rynk protocol:
#
#   just check
#   just diff
#   just apply
#   just show
#   just pull
#
# Keymap model:
# - A [[layer]]'s position in this file is its firmware layer slot (0-7).
# - `id` and `name` are host-side labels. The firmware stores neither; pull
#   preserves existing labels when possible and otherwise synthesizes them.
# - `keys` is the 6x14 grid, row-major, whitespace-separated, one row per
#   line. Tokens are the same QMK-style names `keymap read`/`keymap set`
#   use (see `keymap find`); `--` is an unbound key (KC_NO) and marks the
#   four physical holes at r0c5, r0c8, r5c5, r5c8. `#` comments run to the
#   end of the line. Columns 0-6 are the left half (col 6 = left thumbs),
#   columns 7-13 the right half (col 7 = right thumbs).
# - A sparse layer may omit `keys` and carry `[[layer.key]]` entries instead;
#   every key it does not name stays transparent, and a bind's lighting scene
#   can sit right beside it (README: "Selector-addressed bindings").
#
# Apply semantics: changed key bindings are written with read-back verification
# but are not atomic across the whole keymap. Durable lighting scenes are
# replaced atomically, and the full managed runtime state is verified afterward.

# --- Layer 0: Base -----------------------------------------------------------
# The bottom row's old Home/End pair is now the instant layer pair: MO(1) for
# Lower and MO(5) for Paseo, live on key-down with no tap-hold window. Both
# layers keep their tap-hold entries (LT(1,...) and TD(0)) as well. Home and
# End themselves move to the same two positions on Lower; reaching Home there
# means entering Lower through an LT key, since MO(1) is that key.
[[layer]]
id = "base"
name = "Base"
keys = """
KC_F1    KC_F2    KC_F3   KC_F4    KC_F5    --       KC_ESC        KC_BSPC  --       KC_F6  KC_F7    KC_F8    KC_F9          KC_F10
KC_EQL   KC_1     KC_2    KC_3     KC_4     KC_5     TD(0)         TG(4)    KC_6     KC_7   KC_8     KC_9     KC_0           KC_MINS
KC_TAB   KC_Q     KC_W    KC_E     KC_R     KC_T     MO(2)         KC_LGUI  KC_Y     KC_U   KC_I     KC_O     KC_P           KC_BSLS
KC_LCTL  KC_A     KC_S    KC_D     KC_F     KC_G     KC_BSPC       KC_SPC   KC_H     KC_J   KC_K     KC_L     LT(1,KC_SCLN)  KC_QUOT
KC_LSFT  KC_Z     KC_X    KC_C     KC_V     KC_B     KC_LGUI       KC_ENT   KC_N     KC_M   KC_COMM  KC_DOT   KC_SLSH        KC_RSFT
KC_GRV   MO(1)    MO(5)   KC_LEFT  KC_RGHT  --       KC_LALT       KC_RGUI  --       KC_UP  KC_DOWN  KC_LBRC  KC_RBRC        TG(3)
"""

# --- Layer 1: Lower (symbols + media) ---------------------------------------
[[layer]]
id = "lower"
name = "Lower"
keys = """
_______  _______       _______       _______        _______        --       _______  _______  --            _______       _______       _______       _______       _______
_______  _______       _______       _______        _______        _______  _______  _______  _______       _______       _______       _______       _______       _______
_______  LSFT(KC_EQL)  LSFT(KC_MINS) LSFT(KC_9)     LSFT(KC_0)     _______  TO(0)    _______  _______       _______       _______       _______       _______       _______
KC_CAPS  LSFT(KC_1)    LSFT(KC_2)    LSFT(KC_3)     LSFT(KC_4)     LSFT(KC_5)  _______  KC_MPLY  LSFT(KC_6)  LSFT(KC_7)   LSFT(KC_8)    LSFT(KC_9)    LSFT(KC_0)    _______
_______  KC_LBRC       KC_RBRC       LSFT(KC_LBRC)  LSFT(KC_RBRC)  _______  _______  _______  _______       _______       _______       _______       _______       _______
_______  KC_HOME       KC_END        KC_MPRV        KC_MNXT        --       _______  _______  --            KC_VOLU       KC_VOLD       _______       _______       _______
"""

# --- Layer 2: Magic (system controls) ---------------------------------------
# The left thumb cluster is the connection selector. The lower arc's three
# keys are BLE slots 1-3 (USER(0)-USER(2)): tapping one selects that slot AND
# prefers BLE output, so typing moves there even while USB is plugged in. The
# upper Esc-position key (QK_OUTPUT_USB) moves typing back to USB. While
# Magic is held every key shows its own slot's state — white empty, red
# paired-but-idle, blue selected, blinking white while advertising, green
# connected — and the USB key mirrors the scheme: green carrying typing,
# blue plugged but idle, red unplugged. Magic+R toggles the maintenance lock;
# R is green while unlocked and red while locked. Bond management goes through
# `moergo-control connection`. USER(12) forwards the bootloader request to
# the right half.
#
# The lighting controls use the familiar WASD cluster plus the left/right
# arrows:
#
#   W: brightness up               S: brightness down
#   E: PaletteFX on/off            T: lighting on/off/auto
#   left arrow: previous effect    right arrow: next effect
#   C: next palette
#
# UG_OMODE, on Magic+T, cycles always-on, always-off, and plugged-in-only.
# Holding Magic temporarily wakes lighting and reveals the information view.
# The runtime scene table carries the full-layer black mask itself, so it does
# not depend on the firmware's compiled Magic scene to hide PaletteFX.
[[layer]]
id = "magic"
name = "Magic"

# The floor: Magic blanks every key it does not name, so the named binds
# below correct this whole-board KC_NO. `all` resolves through the keyboard's
# topology, so `just check` only confirms it is well formed.
[[layer.key]]
all = true
action = "KC_NO"

[[layer.key]]
key = [0, 6]  # upper Esc-position thumb key: move typing to USB
action = "QK_OUTPUT_USB"

# The USB key's state: red = unplugged, blue = plugged but typing elsewhere,
# green = carrying typing.
[[lighting.conditional_scene]]
key = [0, 6]
color = "#b00000"
layer = { layer = 2, active = true }
connection = { usb_connected = false }

[[lighting.conditional_scene]]
key = [0, 6]
color = "#0050ff"
layer = { layer = 2, active = true }
connection = { usb_connected = true }

[[lighting.conditional_scene]]
key = [0, 6]
color = "#00c020"
layer = { layer = 2, active = true }
connection = { transport = "usb" }

[[layer.key]]
key = [2, 2]  # W: brightness up
action = "BL_UP"

[[lighting.scene]]
layer = 2
key = [2, 2]
color = "#ffff00"

[[layer.key]]
key = [2, 3]  # E: PaletteFX on/off
action = "RGB_TOG"

# E reads the state RGB_TOG flips: green while effects render, dim red while
# they are toggled off.
[[lighting.conditional_scene]]
key = [2, 3]
color = "#008000"
layer = { layer = 2, active = true }
effects = { enabled = true }

[[lighting.conditional_scene]]
key = [2, 3]
color = "#800000"
layer = { layer = 2, active = true }
effects = { enabled = false }

[[layer.key]]
key = [2, 4]  # R: maintenance lock toggle
action = "MAINT_LOCK_TOG"

[[layer.key]]
key = [2, 5]  # T: cycle lighting always-on / always-off / plugged-in-only
action = "UG_OMODE"

# T shows the live output-mode policy, which is what let the indicator stop
# being compiled into the firmware.
[[lighting.conditional_scene]]
key = [2, 5]
color = "#008000"
layer = { layer = 2, active = true }
output_mode = "always-on"

[[lighting.conditional_scene]]
key = [2, 5]
color = "#800000"
layer = { layer = 2, active = true }
output_mode = "always-off"

[[lighting.conditional_scene]]
key = [2, 5]
color = "#0040a0"
layer = { layer = 2, active = true }
output_mode = "powered-only"

[[layer.key]]
key = [3, 0]
action = "QK_BOOT"

[[layer.key]]
key = [3, 2]  # S: brightness down
action = "BL_DOWN"

[[lighting.scene]]
layer = 2
key = [3, 2]
color = "#ffff00"

[[layer.key]]
key = [3, 6]  # lower thumb arc: BLE slot 1
action = "USER(0)"

# Slot keys share one color scheme (later rules win): white = empty, red =
# paired but idle, blue = selected or connected-but-idle, blinking white =
# advertising, green = carrying typing. Green means "keystrokes go here"
# everywhere, so a connected slot only turns green once BLE is the active
# transport — otherwise it stays blue like a plugged-but-idle USB key.
[[lighting.conditional_scene]]
key = [3, 6]
color = "#2a2a2a"
layer = { layer = 2, active = true }
connection = { bonded = { slot = 0, bonded = false } }

[[lighting.conditional_scene]]
key = [3, 6]
color = "#b00000"
layer = { layer = 2, active = true }
connection = { bonded = { slot = 0, bonded = true } }

[[lighting.conditional_scene]]
key = [3, 6]
color = "#0050ff"
layer = { layer = 2, active = true }
connection = { profile = 0, ble_state = "inactive" }

[[lighting.conditional_scene]]
key = [3, 6]
color = "#ffffff"
effect = "blink"
period_ms = 800
phase_ms = 0
duty = 50
layer = { layer = 2, active = true }
connection = { profile = 0, ble_state = "advertising" }

[[lighting.conditional_scene]]
key = [3, 6]
color = "#0050ff"
layer = { layer = 2, active = true }
connection = { profile = 0, ble_state = "connected" }

[[lighting.conditional_scene]]
key = [3, 6]
color = "#00c020"
layer = { layer = 2, active = true }
connection = { profile = 0, ble_state = "connected", transport = "ble" }

[[layer.key]]
key = [3, 13]  # forward the bootloader request to the right half
action = "USER(12)"

[[layer.key]]
key = [4, 0]
action = "QK_RBT"

[[layer.key]]
key = [4, 3]  # C: next palette
action = "RGB_HUI"

[[lighting.scene]]
layer = 2
key = [4, 3]
color = "#ff00ff"

[[layer.key]]
