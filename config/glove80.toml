# --- Layer 4: Mac Hyper ------------------------------------------------------
# MOD(...) directly holds the modifier combination until the key is released.
[[layer]]
id = "mac_hyper"
name = "Mac Hyper"

[[layer.key]]
key = [1, 7]  # the toggle that entered the layer leaves it
action = "TG(4)"

[[layer.key]]
key = [5, 7]  # right thumb: hold for ctrl+alt+gui
action = "MOD(MOD_LCTL|MOD_LALT|MOD_LGUI)"

# --- Layer 5: Paseo ----------------------------------------------------------
# Tap Delete normally; hold it to activate this layer. The key is TD(0), whose
# hold window lives in the morse table below.
# Mnemonics: F/O/S/L select Fable/Opus/Sol/Luna; Q/M/H select
# low (quick)/medium/high effort. F13-F19 are the host shortcut namespace.
#
# The host half of this contract lives in Paseo, whose shortcut overrides
# persist to renderer localStorage (`@paseo:keyboard-shortcut-overrides` under
# the `paseo://app` origin) rather than to any file, so it cannot be checked in
# alongside this keymap. Recorded here so the pairing survives a reset:
#
#   F13  command-center.shortcut:models:claude:claude-fable-5
#   F14  command-center.shortcut:models:claude:claude-opus-5
#   F15  command-center.shortcut:models:codex:gpt-5.6-sol
#   F16  command-center.shortcut:models:codex:gpt-5.6-luna
#   F17  command-center.shortcut:thinking:low
#   F18  command-center.shortcut:thinking:medium
#   F19  command-center.shortcut:thinking:high
#
# Rebind through Settings -> Shortcuts (Model and Thinking sections). Those rows
# only became bindable in getpaseo/paseo#2845; before that fix they rendered
# permanently greyed out because availability was computed from the live
# contribution set, which is empty on the settings route.
# Written sparsely, one bind per mnemonic with its scene beside it: Claude
# models are orange, Codex models are blue, and effort runs from green
# through amber to red.
[[layer]]
id = "paseo"
name = "Paseo"

[[layer.key]]
key = [3, 4]  # F: Fable
action = "KC_F13"

[[lighting.scene]]
layer = 5
key = [3, 4]
color = "#d06040"

[[layer.key]]
key = [2, 11]  # O: Opus
action = "KC_F14"

[[lighting.scene]]
layer = 5
key = [2, 11]
color = "#d06040"

[[layer.key]]
key = [3, 2]  # S: Sol
action = "KC_F15"

[[lighting.scene]]
layer = 5
key = [3, 2]
color = "#0080ff"

[[layer.key]]
key = [3, 11]  # L: Luna
action = "KC_F16"

[[lighting.scene]]
layer = 5
key = [3, 11]
color = "#0080ff"

[[layer.key]]
key = [2, 1]  # Q: low (quick) effort
action = "KC_F17"

[[lighting.scene]]
layer = 5
key = [2, 1]
color = "#00c040"

[[layer.key]]
key = [4, 9]  # M: medium effort
action = "KC_F18"

[[lighting.scene]]
layer = 5
key = [4, 9]
color = "#d08000"

[[layer.key]]
key = [3, 8]  # H: high effort
action = "KC_F19"

[[lighting.scene]]
layer = 5
key = [3, 8]
color = "#c02020"

# --- Morse table -------------------------------------------------------------
# Morse 0 is the Paseo thumb key, addressed as TD(0) on the base layer: tap
# Delete, hold for layer 5. It exists as a morse rather than an LT so its hold
# window can be tuned here, from the host, without a firmware flash. That hold
# is a deliberate thumb press rather than a rolled home row mod, so it commits
# sooner than the firmware's 250 ms default. Everything left out — gap, quick
# tap, mode — stays at the keyboard's global defaults.
[[morse]]
name = "Paseo layer"
tap = "KC_DEL"
hold = "MO(5)"
hold_timeout_ms = 180

[lighting]
brightness = 255
output_mode = "powered-only"
wake_layers = [2]
scene_policy = "active-stack"

[lighting.background]
enabled = false
hue = 0
saturation = 0
value = 0
speed = 128
mode = "solid"

# Rynk's generic lighting-extension state. Names come from the connected
# firmware's extension descriptor; PaletteFX is the current provider.
[lighting.effects]
effect = "Crosshair"
palette = "Polarized"
value = 255
speed = 32

# Per-effect parameters, by the names the firmware advertises. Only the ones
# listed here are managed: anything left out keeps whatever the keyboard has,
# which is what makes live tuning in Rynkbench safe to leave in place.
#
# Crosshair is the default effect. Its full live tuning is pinned here so the
# source profile reproduces the current look exactly.
[lighting.effects.params.Crosshair]
"Arm hue" = 0
"Arm width" = 11
Crosses = 1
"Duration x10ms" = 90
"Key hue" = 173
Motion = 0
"Pulse width" = 170

# Comet flies one body to each pressed key instead of lighting the key where
# it was pressed, so it arrives late and swings wide of a key it is redirected
# onto mid-flight. `Lag x10ms` buys a flight the full width of the board and
# `Distance pace` decides how much of that a shorter hop gives back -- at 200
# a next-key hop costs about a third of a full crossing, which is what keeps
# the comet in touch with fast typing. Every duration here is scaled by the
# shared `speed = 32` above, so the real full-board flight is nearer 440 ms.
[lighting.effects.params.Comet]
"Lag x10ms" = 32
"Distance pace" = 200
Momentum = 168
"Trail x10ms" = 20
"Head size" = 14
"Linger x10ms" = 80

# Keep Rain's tuned density available when cycling back to it. Spawn is in
# units of 10 ms, so 5 is a drop every 50 ms; the slot count then caps how many
# are airborne.
[lighting.effects.params.Rain]
Drops = 11
"Rain hue" = 172
"Spawn x10ms" = 5
Trail = 161
Width = 14

