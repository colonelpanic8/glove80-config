color = "#2a2a2a"
layer = { layer = 2, active = true }
connection = { bonded = { slot = 1, bonded = false } }

[[lighting.conditional_scene]]
key = [4, 6]
color = "#b00000"
layer = { layer = 2, active = true }
connection = { bonded = { slot = 1, bonded = true } }

[[lighting.conditional_scene]]
key = [4, 6]
color = "#0050ff"
layer = { layer = 2, active = true }
connection = { profile = 1, ble_state = "inactive" }

[[lighting.conditional_scene]]
