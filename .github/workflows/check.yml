name: Check configuration and publish firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v25
      - name: Validate runtime configuration
        run: ./bin/glove80-control config validate config/glove80.toml

  configured-firmware:
    name: Build configured firmware
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v25
      - name: Build and validate both configured firmware halves
        run: nix develop path:./dependencies/glove80-rmk --command just firmware
      - name: Upload configured firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: glove80-config-firmware
          path: dependencies/glove80-rmk/dist/

  release-master:
    name: Publish configured firmware release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: configured-firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download configured firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: glove80-config-firmware
          path: dist
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          tag="firmware-${short_sha}"
          title="Configured firmware ${short_sha}"
          notes="Configured Glove80 firmware built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}. The compiled defaults come from config/firmware.toml. Flash the -rh.uf2 image on the right half first, then the -lh.uf2 image on the left half."

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "${tag}" \
              --latest \
              --title "${title}" \
              --notes "${notes}" \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${tag}" dist/* \
              --latest \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes "${notes}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
