name: Check configuration and publish firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v25
      - name: Validate runtime configuration
        run: nix develop path:./dependencies/moergo-rmk --command just check

  configured-firmware:
    name: Build configured firmware
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v25
      - name: Build and validate both configured keyboards
        run: nix develop path:./dependencies/moergo-rmk --command just firmware-all
      - name: Upload configured firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: moergo-config-firmware
          path: dependencies/moergo-rmk/dist/

  release-master:
    name: Publish configured firmware release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: configured-firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two commits landing together would otherwise race for the same calendar
    # version, and the loser's `gh release create` would fail on the taken tag.
    concurrency:
      group: release-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download configured firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: moergo-config-firmware
          path: dist
      # The Go60 bundle's manifest.json and SHA256SUMS would collide with the
      # Glove80 bundle's as flat release assets, so it ships as one archive.
      - name: Archive Go60 bundle
        run: |
          (cd dist/go60 && zip -r ../../go60-rmk.zip .)
          rm -rf dist/go60
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running a published commit must land back on its own release
          # instead of minting a second version for identical firmware.
          tag="$(git tag --points-at "${GITHUB_SHA}" --list 'v*' | head -1)"
          if [ -z "${tag}" ]; then
            day="$(git show -s --format=%cd --date=format-local:%Y.%m.%d "${GITHUB_SHA}")"
            build=1
            while git rev-parse -q --verify "refs/tags/v${day}.${build}" >/dev/null; do
              build=$((build + 1))
            done
            tag="v${day}.${build}"
          fi
          title="MoErgo firmware ${tag#v}"

          previous="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "${previous}" ]; then
            changes="$(git log --reverse --pretty='- %s' "${previous}..${GITHUB_SHA}")"
          else
            changes="$(git log --reverse --pretty='- %s' -20 "${GITHUB_SHA}")"
          fi
          {
            echo "## Changes"
            echo
            echo "${changes:-- No commits since the previous release.}"
            echo
            echo "The Go60 firmware is attached as go60-rmk.zip."
          } > release-notes.md

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* go60-rmk.zip \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "${tag}" \
              --latest \
              --title "${title}" \
              --notes-file release-notes.md \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${tag}" dist/* go60-rmk.zip \
              --latest \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file release-notes.md \
              --repo "${GITHUB_REPOSITORY}"
          fi
